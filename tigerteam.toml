# tigerteam project config — the one committed config file (v4).
# Resolution chain: defaults -> ~/.tigerteam.toml -> <root>/tigerteam.toml
# -> curated WORKER_* env -> --set key=value.  NO SECRETS in this file — only names.

# --disable-sandbox is REQUIRED here: SwiftPM evaluates Package.swift inside its
# own nested `sandbox-exec`, and macOS refuses to nest Seatbelt sandboxes, so a
# worker running under sandbox_profile fails with "sandbox_apply: Operation not
# permitted" without it. The outer Seatbelt profile is the real boundary.
test_cmd = "bash scripts/test-all.sh"
# verify_cmds = ["bash .tigerteam/scripts/run-tests.sh"]
# staging = false
# quiet_load = 8.0
# debounce_s = 60
# artifact_globs = ["game/e2e/__shots__/*.png"]
# ui_port = 8383

[workers]
max_concurrent = 6              # host capacity; reference host: 12 cores -> 4-5
env_passthrough = ["DEEPINFRA_KEY"]   # names only, never values

# engine = "claude"
# model = "glm-5.2"
# base_url = "https://api.z.ai/api/anthropic"
# isolation = "worktree"
# orientation_prefix = true
# image = "tigerteam-agents:base"  # machine-local; consider ~/.tigerteam.toml
# agents_home = "/home/you/.agents-home"  # machine-local; consider ~/.tigerteam.toml
# secrets_dir = "/home/you/.tigerteam-secrets"  # machine-local; consider ~/.tigerteam.toml

# Worker profiles (SPEC §3.3). Uncomment and edit for your fleet:
#

# [worker.codex]
# engine = "codex"
# max_complexity = 2
# ticket_timeout_s = 3600
# scale=2

# [worker.grok]
# engine = "grok"
# max_complexity = 2
# ticket_timeout_s = 3600

# [worker.grok]
# engine = "grok"
# max_complexity = 2
# ticket_timeout_s = 3600

# -------------------

[worker.codex]
engine = "codex"
model = "gpt-5.6-sol"
max_complexity = 3
capabilities = ["frontier"]  # reserved tier tag, DECISIONS 2026-08-25
ticket_timeout_s = 5400
scale = 2

[worker.grok]
engine = "grok"
max_complexity = 3
scale = 0 #out of quota 

[worker.luna]
engine = "codex"
model = "gpt-5.6-luna"
max_complexity = 2

[worker.kimi]
engine = "kimi"
max_complexity = 3
capabilities = ["frontier"]

[worker.ds]
engine = "pi"
max_complexity = 2  # new model (2026-08-17): C2 until it earns C3
model = "deepinfra/deepseek-ai/DeepSeek-V4-Flash-0731"  # GLM-5.3 retired provider-side 2026-08-17
env_passthrough = ["DEEPINFRA_KEY"]
scale = 2

[worker.opus]
engine = "claude"
model = "opus"
login_auth = true
max_complexity = 3
capabilities = ["frontier", "macbuild"]
scale = 2
# Outside Seatbelt (user-authorised 2026-08-30) so this lane can run
# `xcodegen` + `xcodebuild` to compile/verify the macOS App & Widget, which the
# sandboxed lanes cannot. Trusted-repo only; opus = claude engine on the user's
# own login. Reserved for macbuild-tagged tickets; other work stays sandboxed.
sandbox_profile = ""











